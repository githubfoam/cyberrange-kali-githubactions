name: Deploy TheHive, Cortex & MISP

on:
  push:
    branches:
      - test
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up Docker Compose
        uses: docker/setup-docker@v3

      # Step 3: Log in to Docker Hub (optional if using private images)
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v2
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Start services
      - name: Deploy with Docker Compose
        run: |
          docker-compose -f docker-compose.yml up -d --build
          echo "Waiting for services to start..."
          sleep 60  # Adjust based on startup time

      # Step 5: Verify services
      - name: Check if TheHive is running
        run: |
          docker ps | grep thehive

      - name: Check if Cortex is running
        run: |
          docker ps | grep cortex

      - name: Check if MISP is running
        run: |
          docker ps | grep misp
