name: Threat Intelligence CI

on:
  push:
    branches: [ test ]
  pull_request:
    branches: [ test ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Pull and start Docker Compose services
        run: |
          docker-compose down
          docker-compose pull
          docker-compose up -d
          
      - name: List running containers
        run: docker ps
