name: Shuffle CI

on:
  push:
    branches: [ "test" ]
  pull_request:
    branches: [ "test" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Shuffle Docker image
        run: |
          docker build -t shuffle-backend -f Dockerfile .

      - name: Run Shuffle container
        run: |
          docker run -d --name shuffle-test -p 3001:3001 shuffle-backend
          sleep 20

      - name: Test Shuffle service (HTTP healthcheck)
        run: |
          curl --fail http://localhost:3001 || (echo "Shuffle not running" && exit 1)

      - name: Check container logs
        run: |
          docker logs shuffle-test | tail -n 50

      - name: Cleanup
        if: always()
        run: |
          docker stop shuffle-test
          docker rm shuffle-test
