name: Shuffle Fullstack CI

on:
  push:
    branches: [ "test" ]
  pull_request:
    branches: [ "test" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: docker compose version

      - name: Build and start services
        run: |
          docker compose up -d --build
          sleep 30  # give backend+frontend time to start

      - name: Test Backend API
        run: |
          curl --fail http://localhost:3001 || (echo "Backend not running" && exit 1)

      - name: Test Frontend UI
        run: |
          curl --fail http://localhost:8080 || (echo "Frontend not running" && exit 1)

      - name: Show Logs (for debugging)
        run: |
          docker compose logs backend
          docker compose logs frontend

      - name: Cleanup
        if: always()
        run: docker compose down
