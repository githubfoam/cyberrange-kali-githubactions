services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  thehive:
    image: strangebee/thehive:5.1.0
    depends_on:
      - elasticsearch
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1024m
      - THEHIVE_ELASTICSEARCH__URL=http://elasticsearch:9200
    ports:
      - "9000:9000"
    volumes:
      - thehive_data:/opt/thehive/data

  cortex:
    image: thehiveproject/cortex:3.1.0
    depends_on:
      - elasticsearch
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1024m
      - CORTEX_ELASTICSEARCH__URL=http://elasticsearch:9200
    ports:
      - "9001:9001"
    volumes:
      - cortex_data:/opt/cortex/data

  misp:
    image: harvarditsecurity/misp:latest
    ports:
      - "443:443"
    environment:
      - MYSQL_ROOT_PASSWORD=securepassword
      - MISP_ADMIN_EMAIL=admin@misp.local
      - MISP_ADMIN_PASSPHRASE=admin123
    volumes:
      - misp_data:/var/www/MISP

  wazuh:
    image: wazuh/wazuh:4.7.2
    ports:
      - "1514:1514/udp"
      - "55000:55000"
    volumes:
      - wazuh_data:/var/ossec/data

volumes:
  esdata:
  thehive_data:
  cortex_data:
  misp_data:
  wazuh_data:
