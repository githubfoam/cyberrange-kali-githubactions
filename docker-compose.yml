
networks:
  cicd-net:
    driver: bridge

services:
  # -------------------------
  # Nginx Reverse Proxy
  # -------------------------
  nginx:
    image: nginx:alpine
    container_name: nginx
    depends_on:
      - thehive
      - cortex
      - wazuh
      - misp
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - cicd-net

  # -------------------------
  # TheHive
  # -------------------------
  thehive:
    image: strangebee/thehive:5.2
    container_name: thehive
    depends_on:
      - cassandra
      - elasticsearch
      - minio
      - cortex
    environment:
      - THEHIVE_CORTEX_URL=http://cortex:9001
      - CORS_ALLOW_ORIGIN=*
      - JAVA_OPTS=-Xms512M -Xmx1024M
    volumes:
      - thehive-data:/data
    networks:
      - cicd-net

  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - cicd-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - cicd-net

  minio:
    image: minio/minio:RELEASE.2025-08-01T23-15-46Z
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    volumes:
      - minio-data:/data
    networks:
      - cicd-net

  # -------------------------
  # Cortex
  # -------------------------
  cortex:
    image: thehiveproject/cortex:4.2.0-1
    container_name: cortex
    depends_on:
      - elasticsearch
    environment:
      - CORTEX_ELASTICSEARCH_HOST=elasticsearch
      - CORTEX_ELASTICSEARCH_PORT=9200
      - CORTEX_ADMIN_PASSWORD=SecretPassword
    volumes:
      - cortex-data:/data
    networks:
      - cicd-net

  # -------------------------
  # Wazuh
  # -------------------------
  wazuh:
    image: wazuh/wazuh:5.3.3
    container_name: wazuh
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    ports:
      - "55000:55000"
      - "1514:1514/udp"
      - "514:514/udp"
      - "5601:5601"
    volumes:
      - wazuh-data:/var/ossec/data
    networks:
      - cicd-net

  # -------------------------
  # MISP
  # -------------------------
  misp:
    image: harvarditsecurity/misp
    container_name: misp
    depends_on:
      - misp-db
    environment:
      MYSQL_ROOT_PASSWORD: misp
      MYSQL_PASSWORD: misp
      MISP_ADMIN_EMAIL: admin@misp.local
      MISP_ADMIN_PASSWORD: SecretPassword
      MISP_FQDN: misp.local
    volumes:
      - misp-data:/var/www/MISP
    networks:
      - cicd-net

  misp-db:
    image: mysql:8.0
    container_name: misp-db
    environment:
      MYSQL_ROOT_PASSWORD: misp
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: misp
    volumes:
      - misp-db-data:/var/lib/mysql
    networks:
      - cicd-net

volumes:
  thehive-data:
  cassandra-data:
  es-data:
  minio-data:
  cortex-data:
  wazuh-data:
  misp-data:
  misp-db-data:
